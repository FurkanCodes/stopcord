[workspace]
resolver = "3"
members = ["crates/term", "crates/detect", "crates/daemon", "crates/sandbox", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
libc = "0.2"
portable-pty = "=0.9.0"
regex = "1.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.24"
toml = "0.8"
vt100 = "0.16.2"
