# Screen rules for Gemini CLI.
# Adapted from herdr's detection manifest src/detect/manifests/gemini.toml
# (https://github.com/herdrdev/herdr), licensed under the Apache License 2.0;
# see LICENSE-herdr.txt beside this file. Changed for Sawtooth: added `names`
# and dropped herdr's label aliases, and added the trust_folder rule at the end.
# The rule format is otherwise the same.

id = "gemini"
names = ["gemini", "gemini-cli"]
version = "2026.06.10.1"
min_engine_version = 1
updated_at = "2026-06-10T00:00:00Z"

[[rules]]
id = "apply_or_allow_change"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
any = [
  { contains = ["│ Apply this change"] },
  { contains = ["│ Allow execution"] },
  { all = [{ contains = ["yes"] }, { any = [{ contains = ["waiting for user confirmation"] }, { contains = ["│ Do you want to proceed"] }, { contains = ["do you want to proceed?"] }] }] },
  { line_regex = ['(?i)^\s*❯.*(yes|allow)'] },
]

[[rules]]
id = "esc_cancel_working"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
contains = ["esc to cancel"]

# Added by Sawtooth: the folder-trust dialog Gemini CLI shows the first time it
# starts in a folder. Seen on a real run on 2026-11-08.
[[rules]]
id = "trust_folder"
state = "blocked"
priority = 310
region = "whole_recent"
contains = ["Do you trust the files in this folder?"]
