[package]
name = "sawtooth-app"
description = "The Sawtooth window onto the terminal daemon."
version.workspace = true
edition.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = "0.10"
sha2 = "0.10"
sawtooth-daemon = { path = "../../crates/daemon" }
sawtooth-sandbox = { path = "../../crates/sandbox" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile.workspace = true

# ⌘esc never reaches the web view, so the app watches for it natively.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSEvent"] }
