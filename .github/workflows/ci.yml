name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the version, so CI lints with the same clippy as a local build.
      - name: Install Rust
        run: rustup show

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript packages
        run: npm ci

      - name: Typecheck the window
        run: npm run typecheck

      # The app embeds the built window, so it has to exist before cargo builds the app.
      - name: Build the window
        run: npm run build --workspace app

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace
