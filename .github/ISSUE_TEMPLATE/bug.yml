name: Bug
description: Something doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: If this is a way for an agent to get out of its sandbox, please report it privately instead, as described in SECURITY.md.
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: What you did, in order.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Include any error text from the window.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS, agent CLI and runner level
      placeholder: macOS 26.1, claude 2.1.323, contained
